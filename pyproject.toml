[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bookly-telegram"
version = "0.1.0"
description = "Modular Telegram booking backend"
requires-python = ">=3.12"
dependencies = ["aiogram==3.22.0", "SQLAlchemy==2.0.43", "asyncpg==0.30.0", "psycopg[binary]==3.2.9", "alembic==1.16.5", "pydantic==2.11.7", "pydantic-settings==2.10.1", "APScheduler==3.11.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "ruff==0.12.12", "aiosqlite==0.21.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
